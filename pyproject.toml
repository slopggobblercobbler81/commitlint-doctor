[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commitlint-doctor"
version = "1.0.0"
description = "Production-grade Conventional Commits validator, git hook enforcer, and commit history linter."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81" }
]
keywords = [
    "commitlint",
    "conventional-commits",
    "git-hooks",
    "commit-msg",
    "linter",
    "git",
    "cli",
    "developer-tools"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
commitlint-doctor = "commitlint_doctor.cli:main"
commitlint-doc = "commitlint_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/slopggobblercobbler81/commitlint-doctor"
Repository = "https://github.com/slopggobblercobbler81/commitlint-doctor"
Issues = "https://github.com/slopggobblercobbler81/commitlint-doctor/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["."]
include = ["commitlint_doctor*"]
